[package]
name = "flow-orchestrator-tui"
version = "0.1.0"
edition = "2021"
authors = ["Flow Team"]
description = "Terminal UI for Flow-Nexus orchestration and swarm management"
license = "MIT"
repository = "https://github.com/kvnloo/evolve"
rust-version = "1.80.0"

[dependencies]
# TUI Framework
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
tachyonfx = { version = "0.5", optional = true }

# Async Runtime
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Time & Date
chrono = { version = "0.4", features = ["serde"] }

# HTTP & API
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
oauth2 = "4.4"

# Security & Storage
keyring = { version = "2.3", features = ["platform-all"] }
ring = "0.17"
base64 = "0.21"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2.1"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Configuration
config = { version = "0.14", features = ["toml", "json"] }
dirs = "5.0"

# CLI
clap = { version = "4.5", features = ["derive", "env", "cargo"] }

# Additional Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
url = "2.5"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"

# WebSocket Support
tokio-tungstenite = "0.21"

# Color & Styling
termcolor = "1.4"
unicode-width = "0.1"

# Terminal Detection
atty = "0.2"
async-trait = "0.1.89"

[dev-dependencies]
# Testing
mockall = "0.12"
insta = { version = "1.35", features = ["json"] }
tempfile = "3.10"
tokio-test = "0.4"
wiremock = "0.6"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# Property Testing
proptest = "1.4"
quickcheck = "1.0"

[features]
default = ["tls-native"]
tls-native = ["reqwest/native-tls"]
tls-rustls = ["reqwest/rustls-tls"]
animations = ["tachyonfx"]
integration-tests = []
bench = []

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# Benchmarks commented out until implemented
# [[bench]]
# name = "tui_rendering"
# harness = false
# required-features = ["bench"]
#
# [[bench]]
# name = "api_client"
# harness = false
# required-features = ["bench"]

[workspace]
members = ["."]

# Cargo build configuration
[build]
jobs = 4

# Documentation settings
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
